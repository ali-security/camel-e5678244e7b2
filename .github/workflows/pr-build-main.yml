name: PR Build (Camel 4)

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional surefire -Dtest selector; empty runs the full suite'
        required: false
        default: ''

permissions: 
  contents: read

jobs:
  build:
    permissions:
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - id: install-packages
        uses: ./.github/actions/install-packages
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@6a0805fcefea3d4657a47ac4c165951e33482018 # v4.2.2
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: maven build
        run: ./mvnw -B -V --no-transfer-progress -Dquickly -DskipTests install -pl core/camel-core,components/camel-xpath -am
      - name: mvn test
        shell: bash
        env:
          FILTER: ${{ inputs.test-filter }}
        run: |
          GATES="-Dformatter.skip=true -Dimpsort.skip=true -Dlicense.skip=true"
          if [ -n "$FILTER" ]; then
            ./mvnw -B --no-transfer-progress $GATES install -pl core/camel-core,components/camel-xpath -Dtest="${FILTER// /,}" -Dsurefire.failIfNoSpecifiedTests=false
          else
            ./mvnw -B --no-transfer-progress $GATES install -pl core/camel-core,components/camel-xpath
          fi
      - name: test summary and skip report
        if: always()
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import glob, collections, xml.etree.ElementTree as ET
          run = fail = err = skip = 0
          skips = collections.defaultdict(list)
          for f in sorted(glob.glob('core/camel-core/target/surefire-reports/TEST-*.xml') + glob.glob('components/camel-xpath/target/surefire-reports/TEST-*.xml')):
              r = ET.parse(f).getroot()
              for tc in r.iter('testcase'):
                  run += 1
                  if tc.find('failure') is not None:
                      fail += 1
                  elif tc.find('error') is not None:
                      err += 1
                  else:
                      s = tc.find('skipped')
                      if s is not None:
                          skip += 1
                          msg = (s.get('message') or s.text or 'no message').strip().replace('\n', ' ')[:200]
                          skips[msg].append(tc.get('classname', '') + '#' + tc.get('name', ''))
          print('SKIPPED TESTS BY REASON:')
          for msg, tests in sorted(skips.items(), key=lambda kv: -len(kv[1])):
              print('SKIPPED (%d) reason="%s": %s' % (len(tests), msg, ', '.join(tests[:15]) + (' ...' if len(tests) > 15 else '')))
          print('TEST SUMMARY: Tests run: %d, Passed: %d, Failures: %d, Errors: %d, Skipped: %d' % (run, run - fail - err - skip, fail, err, skip))
          PYEOF
      - name: archive jar
        if: matrix.java == '17'
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: camel-xpath-jar
          path: components/camel-xpath/target/camel-xpath-4.8.5.jar
          if-no-files-found: error
